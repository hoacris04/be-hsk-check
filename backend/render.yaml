services:
  - type: web
    name: hsk-check-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hsk-check-db
          property: connectionString

databases:
  - name: hsk-check-db
    databaseName: hsk_check
    user: hsk_user

